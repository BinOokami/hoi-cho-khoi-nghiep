<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trang không tồn tại · Hội chợ khởi nghiệp thanh niên 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Trang này được GitHub Pages dùng cho MỌI đường dẫn không có thật, nên dùng đường dẫn tuyệt đối và tự chứa CSS. */
  :root{--g-950:#08291a;--g-900:#0f3d24;--g-700:#17663a;--g-500:#22a35a;--gold:#f2b544;--gold-2:#d99a1e}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:var(--g-950);display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;inset:0;background:url("/assets/default-cover.webp") center/cover no-repeat;opacity:.55}
  body::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(8,41,26,.9),rgba(15,61,36,.78))}
  .box{position:relative;z-index:1;width:100%;max-width:460px;text-align:center;padding:36px 28px 32px;border-radius:28px;
    background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
    border:1px solid rgba(255,255,255,.28);box-shadow:0 18px 50px -18px rgba(0,0,0,.45)}
  .brand{font-size:13px;font-weight:600;letter-spacing:.3px;opacity:.85;margin:0 0 18px}
  .code{font-size:clamp(64px,18vw,96px);font-weight:800;line-height:1;margin:0;background:linear-gradient(135deg,#ffe2a0,var(--gold) 50%,var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin:12px 0 8px;font-size:clamp(22px,5.5vw,26px);line-height:1.25}
  p{margin:0 0 24px;color:rgba(255,255,255,.82);font-size:15px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;text-decoration:none;color:#3a2604;border-radius:999px;padding:13px 26px;
    background:linear-gradient(135deg,#ffd27a,var(--gold) 45%,var(--gold-2));box-shadow:0 10px 24px -8px rgba(217,154,30,.7);transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
  <main class="box">
    <p class="brand">Hội chợ khởi nghiệp thanh niên 2026</p>
    <div class="code" aria-hidden="true">404</div>
    <h1>Trang không tồn tại</h1>
    <p>Đường dẫn có thể đã bị sai hoặc trang này không còn nữa. Bạn hãy quay về trang chủ nhé.</p>
    <a class="btn" href="/"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Về trang chủ</a>
  </main>
</body>
</html>
